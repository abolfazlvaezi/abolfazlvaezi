<svg width="100%" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Abolfazl Vaezi — GitHub Activity Snapshot</title>
  <desc id="desc">GitHub profile snapshot showing 15 public repositories, 7 contributions in the last year, selected repositories, and technical focus.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="accent" x1="220" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0.18"/>
    </linearGradient>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#94A3B8" stroke-width="0.6" opacity="0.055"/>
    </pattern>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .muted { fill: #94A3B8; }
      .soft { fill: #64748B; }
      .text { fill: #E2E8F0; }
      .border { stroke: #263449; }
    </style>
  </defs>

  <!-- Panel -->
  <rect x="8" y="8" width="1184" height="404" rx="22" fill="url(#bg)" stroke="#263449"/>
  <rect x="8" y="8" width="1184" height="404" rx="22" fill="url(#grid)"/>

  <!-- Top accent -->
  <line x1="42" y1="28" x2="1158" y2="28" stroke="url(#accent)" stroke-width="1.5"/>

  <!-- Header -->
  <g class="ui">
    <text x="42" y="67" font-size="25" font-weight="650" fill="#F8FAFC">Abolfazl Vaezi</text>
    <text x="42" y="91" font-size="14" class="muted">GitHub Activity Snapshot</text>

    <text x="1158" y="67" text-anchor="end" font-size="13" class="soft">abolfazlvaezi</text>
    <text x="1158" y="91" text-anchor="end" font-size="12" class="soft">2026</text>
  </g>

  <!-- Metric cards -->
  <g class="ui">
    <rect x="42" y="116" width="220" height="88" rx="14" fill="#0E1626" stroke="#263449"/>
    <text x="62" y="143" font-size="12" class="soft">PUBLIC REPOSITORIES</text>
    <text x="62" y="181" font-size="30" font-weight="650" fill="#F8FAFC">15</text>

    <rect x="280" y="116" width="220" height="88" rx="14" fill="#0E1626" stroke="#263449"/>
    <text x="300" y="143" font-size="12" class="soft">CONTRIBUTIONS</text>
    <text x="300" y="181" font-size="30" font-weight="650" fill="#F8FAFC">4</text>
    <text x="300" y="197" font-size="10" class="soft">last year</text>

    <rect x="518" y="116" width="640" height="88" rx="14" fill="#0E1626" stroke="#263449"/>
    <text x="540" y="143" font-size="12" class="soft">TECHNICAL FOCUS</text>
    <text x="540" y="173" font-size="14" fill="#CBD5E1">Python · Django · Django REST Framework · SQL · HTML · CSS</text>
    <text x="540" y="195" font-size="13" class="soft">Web Development · Backend · APIs · AI / ML</text>
  </g>

  <!-- Repository section -->
  <g class="ui">
    <text x="42" y="238" font-size="14" font-weight="600" fill="#E2E8F0">Selected repositories</text>

    <!-- Row 1 -->
    <rect x="42" y="253" width="350" height="54" rx="10" fill="#0E1626" stroke="#263449"/>
    <circle cx="62" cy="280" r="4" fill="#38BDF8"/>
    <text x="76" y="276" font-size="13" font-weight="600" fill="#60A5FA">abolfazlvaezi</text>
    <text x="76" y="294" font-size="10" class="soft">GitHub profile configuration</text>

    <rect x="410" y="253" width="350" height="54" rx="10" fill="#0E1626" stroke="#263449"/>
    <circle cx="430" cy="280" r="4" fill="#38BDF8"/>
    <text x="444" y="276" font-size="13" font-weight="600" fill="#60A5FA">NPD-project</text>
    <text x="444" y="294" font-size="10" class="soft">Repository</text>

    <rect x="778" y="253" width="380" height="54" rx="10" fill="#0E1626" stroke="#263449"/>
    <circle cx="798" cy="280" r="4" fill="#38BDF8"/>
    <text x="812" y="276" font-size="13" font-weight="600" fill="#60A5FA">net-pardaz</text>
    <text x="812" y="294" font-size="10" class="soft">Repository</text>

    <!-- Row 2 -->
    <rect x="42" y="317" width="350" height="54" rx="10" fill="#0E1626" stroke="#263449"/>
    <circle cx="62" cy="344" r="4" fill="#38BDF8"/>
    <text x="76" y="340" font-size="13" font-weight="600" fill="#60A5FA">NTPD</text>
    <text x="76" y="358" font-size="10" class="soft">Python</text>

    <rect x="410" y="317" width="350" height="54" rx="10" fill="#0E1626" stroke="#263449"/>
    <circle cx="430" cy="344" r="4" fill="#38BDF8"/>
    <text x="444" y="340" font-size="13" font-weight="600" fill="#60A5FA">venv-NTPD</text>
    <text x="444" y="358" font-size="10" class="soft">Repository</text>

    <rect x="778" y="317" width="380" height="54" rx="10" fill="#0E1626" stroke="#263449"/>
    <circle cx="798" cy="344" r="4" fill="#A78BFA"/>
    <text x="812" y="340" font-size="13" font-weight="600" fill="#60A5FA">dollerize-project</text>
    <text x="812" y="358" font-size="10" class="soft">Python</text>
  </g>

  <!-- Activity indicator: only the known contribution count is represented -->
  <g class="ui">
    <text x="42" y="397" font-size="10" class="soft">7 contributions in the last year</text>

    <g transform="translate(270,386)">
      <rect x="0" y="0" width="8" height="8" rx="2" fill="#172033" stroke="#263449"/>
      <rect x="13" y="0" width="8" height="8" rx="2" fill="#172033" stroke="#263449"/>
      <rect x="26" y="0" width="8" height="8" rx="2" fill="#172033" stroke="#263449"/>
      <rect x="39" y="0" width="8" height="8" rx="2" fill="#172033" stroke="#263449"/>
      <rect x="52" y="0" width="8" height="8" rx="2" fill="#172033" stroke="#263449"/>
      <rect x="65" y="0" width="8" height="8" rx="2" fill="#172033" stroke="#263449"/>
      <rect x="78" y="0" width="8" height="8" rx="2" fill="#172033" stroke="#263449"/>

      <rect x="104" y="0" width="8" height="8" rx="2" fill="#38BDF8" filter="url(#glow)"/>
      <rect x="117" y="0" width="8" height="8" rx="2" fill="#38BDF8"/>
      <rect x="130" y="0" width="8" height="8" rx="2" fill="#A78BFA"/>
      <rect x="143" y="0" width="8" height="8" rx="2" fill="#38BDF8"/>
      <rect x="156" y="0" width="8" height="8" rx="2" fill="#A78BFA"/>
      <rect x="169" y="0" width="8" height="8" rx="2" fill="#38BDF8"/>
      <rect x="182" y="0" width="8" height="8" rx="2" fill="#A78BFA"/>
    </g>

    <text x="1158" y="397" text-anchor="end" font-size="10" class="soft">GitHub · public profile</text>
  </g>
</svg>
