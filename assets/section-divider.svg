<svg width="100%" viewBox="0 0 1200 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Decorative divider: backend, API, data and AI motif">

  <!-- ============================================================
       Decorative divider — Abolfazl Vaezi
       Minimal "engineering spine": a single line connecting
       small glyphs for Backend / API / SQL / AI.
       No gradients, no filters, no JS — just shapes + strokes.
       Customize colors via the <style> block below.
       ============================================================ -->

  <style>
    .line   { stroke: #33415c; stroke-width: 1.5; }
    .node   { fill: #0e1626; stroke: #33415c; stroke-width: 1.5; }
    .accent { fill: #38bdf8; }
    .accent2{ fill: #a78bfa; }
    .glyph  { fill: none; stroke: #cbd5e1; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .label  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #64748b; letter-spacing: 0.5px; }
  </style>

  <!-- base connecting line -->
  <line x1="40" y1="45" x2="1160" y2="45" class="line"/>

  <!-- end caps -->
  <circle cx="40"   cy="45" r="3" fill="#33415c"/>
  <circle cx="1160" cy="45" r="3" fill="#33415c"/>

  <!-- ============ Node 1 : Backend (Django) ============ -->
  <g transform="translate(140,45)">
    <circle r="24" class="node"/>
    <!-- server / stack glyph -->
    <rect x="-9" y="-11" width="18" height="6" rx="1.5" class="glyph"/>
    <rect x="-9" y="-2"  width="18" height="6" rx="1.5" class="glyph"/>
    <rect x="-9" y="7"   width="18" height="6" rx="1.5" class="glyph"/>
    <circle cx="-4.5" cy="-8" r="0.9" class="accent" stroke="none"/>
    <circle cx="-4.5" cy="1"  r="0.9" class="accent" stroke="none"/>
    <circle cx="-4.5" cy="10" r="0.9" class="accent" stroke="none"/>
    <text x="0" y="46" text-anchor="middle" class="label">DJANGO</text>
  </g>

  <!-- ============ Node 2 : REST API ============ -->
  <g transform="translate(420,45)">
    <circle r="24" class="node"/>
    <!-- bidirectional arrows / endpoint glyph -->
    <path d="M -9,-4 L -1,-4 L -1,-9 L 6,-1 L -1,7 L -1,2 L -9,2 Z" class="glyph" fill="none" transform="translate(0,0) scale(0.9)"/>
    <path d="M 9,4 L 1,4 L 1,9 L -6,1 L 1,-7 L 1,-2 L 9,-2 Z" class="glyph" fill="none" transform="translate(0,0) scale(0.9)"/>
    <text x="0" y="46" text-anchor="middle" class="label">REST API</text>
  </g>

  <!-- ============ Node 3 : SQL / Data ============ -->
  <g transform="translate(700,45)">
    <circle r="24" class="node"/>
    <!-- database cylinder glyph -->
    <g transform="translate(0,-8)">
      <path d="M -9,0 C -9,-2.8 -5,-5 0,-5 C 5,-5 9,-2.8 9,0 L 9,12 C 9,14.8 5,17 0,17 C -5,17 -9,14.8 -9,12 Z" class="glyph"/>
      <path d="M -9,0 C -9,2.8 -5,5 0,5 C 5,5 9,2.8 9,0" class="glyph"/>
      <path d="M -9,6 C -9,8.8 -5,11 0,11 C 5,11 9,8.8 9,6" class="glyph"/>
    </g>
    <text x="0" y="46" text-anchor="middle" class="label">SQL</text>
  </g>

  <!-- ============ Node 4 : AI / ML ============ -->
  <g transform="translate(980,45)">
    <circle r="24" class="node"/>
    <!-- tiny neural node cluster glyph -->
    <g stroke="#cbd5e1" stroke-width="1.4" opacity="0.9">
      <line x1="-9" y1="-6" x2="0" y2="0"/>
      <line x1="-9" y1="6"  x2="0" y2="0"/>
      <line x1="9"  y1="-6" x2="0" y2="0"/>
      <line x1="9"  y1="6"  x2="0" y2="0"/>
    </g>
    <circle cx="-9" cy="-6" r="2.4" class="accent2" stroke="none"/>
    <circle cx="-9" cy="6"  r="2.4" class="accent2" stroke="none"/>
    <circle cx="9"  cy="-6" r="2.4" class="accent" stroke="none"/>
    <circle cx="9"  cy="6"  r="2.4" class="accent" stroke="none"/>
    <circle cx="0"  cy="0"  r="3.2" fill="#f1f5f9" stroke="none"/>
    <text x="0" y="46" text-anchor="middle" class="label">AI / ML</text>
  </g>

</svg>