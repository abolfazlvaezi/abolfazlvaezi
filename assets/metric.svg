<svg
  width="100%"
  height="240"
  viewBox="0 0 900 240"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Abolfazl Vaezi — Web &amp; AI Development</title>
  <desc id="desc">
    A technical systems diagram connecting Web Development, Django and REST APIs,
    AI and Machine Learning, and frontend technologies around a practical development workflow.
  </desc>

  <defs>
    <linearGradient id="web-bg" x1="80" y1="10" x2="845" y2="245" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1120"/>
      <stop offset="0.48" stop-color="#0D1526"/>
      <stop offset="1" stop-color="#09111F"/>
    </linearGradient>

    <radialGradient
      id="web-core-glow"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(450 121) rotate(90) scale(110 220)"
    >
      <stop stop-color="#22D3EE" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="web-accent" x1="300" y1="60" x2="610" y2="194" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.48" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="web-scan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <pattern id="web-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#94A3B8" stroke-opacity="0.035"/>
      <circle cx="0" cy="0" r="1" fill="#94A3B8" fill-opacity="0.05"/>
    </pattern>

    <pattern id="web-micro-grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" stroke="#38BDF8" stroke-opacity="0.04"/>
    </pattern>

    <filter id="web-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <clipPath id="web-panel-clip">
      <rect width="900" height="240" rx="22"/>
    </clipPath>

    <clipPath id="web-core-clip">
      <rect x="380" y="72" width="140" height="98" rx="18"/>
    </clipPath>
  </defs>

  <style>
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .reveal {
      opacity: 0;
      transform: translateY(5px);
      animation: reveal 850ms cubic-bezier(.2,.8,.2,1) forwards;
    }

    .reveal-2 {
      opacity: 0;
      transform: translateY(5px);
      animation: reveal 850ms 160ms cubic-bezier(.2,.8,.2,1) forwards;
    }

    .reveal-3 {
      opacity: 0;
      transform: translateY(5px);
      animation: reveal 850ms 320ms cubic-bezier(.2,.8,.2,1) forwards;
    }

    .loop-draw {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: loopDraw 1800ms 380ms cubic-bezier(.2,.7,.2,1) forwards;
    }

    .core-pulse {
      transform-origin: center;
      animation: corePulse 5.6s 2s ease-in-out infinite;
    }

    .node-pulse {
      transform-origin: center;
      animation: nodePulse 5s ease-in-out infinite;
    }

    .node-pulse-delay {
      transform-origin: center;
      animation: nodePulse 5.8s 2.4s ease-in-out infinite;
    }

    .ambient {
      animation: ambient 7s ease-in-out infinite;
    }

    .scan {
      animation: scan 6.5s 2.5s ease-in-out infinite;
    }

    .signal {
      animation: signalVisibility 8.8s 1.6s ease-in-out infinite;
    }

    @keyframes reveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes loopDraw {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes corePulse {
      0%, 70%, 100% {
        opacity: .08;
        transform: scale(.96);
      }

      82% {
        opacity: .24;
        transform: scale(1.05);
      }

      90% {
        opacity: .12;
        transform: scale(1);
      }
    }

    @keyframes nodePulse {
      0%, 76%, 100% {
        opacity: .3;
        transform: scale(.88);
      }

      84% {
        opacity: .85;
        transform: scale(1.2);
      }

      92% {
        opacity: .42;
        transform: scale(1);
      }
    }

    @keyframes ambient {
      0%, 100% {
        opacity: .12;
      }

      50% {
        opacity: .38;
      }
    }

    @keyframes scan {
      0%, 15% {
        transform: translateX(-90px);
        opacity: 0;
      }

      26% {
        opacity: .55;
      }

      62% {
        opacity: .2;
      }

      80%, 100% {
        transform: translateX(210px);
        opacity: 0;
      }
    }

    @keyframes signalVisibility {
      0%, 10%, 100% {
        opacity: 0;
      }

      16%, 82% {
        opacity: 1;
      }

      90% {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal,
      .reveal-2,
      .reveal-3,
      .loop-draw,
      .core-pulse,
      .node-pulse,
      .node-pulse-delay,
      .ambient,
      .scan,
      .signal {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        stroke-dashoffset: 0 !important;
      }
    }
  </style>

