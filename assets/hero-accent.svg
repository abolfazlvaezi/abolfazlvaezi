<svg width="100%" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abolfazl Vaezi — Web &amp; AI Developer hero banner">
  <!-- ============================================================
       Hero banner for GitHub README
       Author: Abolfazl Vaezi — Web Developer / AI Developer
       ============================================================ -->

  <defs>
    <!-- Background panel gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111a2e"/>
    </linearGradient>

    <!-- Accent gradient: backend / API -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Accent gradient: AI / ML nodes -->
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Soft glow -->
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle dot grid -->
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="320" rx="18" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="320" rx="18" fill="url(#dotGrid)"/>
  <rect
    x="0.5"
    y="0.5"
    width="1199"
    height="319"
    rx="17.5"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.08"
  />

  <!-- ============================================================
       LEFT: Terminal / API
       ============================================================ -->
  <g transform="translate(60,58)">
    <rect
      x="0"
      y="0"
      width="360"
      height="200"
      rx="12"
      fill="#0e1626"
      stroke="#2a3550"
      stroke-width="1.5"
    />

    <!-- Title bar -->
    <rect x="0" y="0" width="360" height="30" rx="12" fill="#151f36"/>
    <rect x="0" y="18" width="360" height="12" fill="#151f36"/>

    <circle cx="18" cy="15" r="4.5" fill="#f87171"/>
    <circle cx="34" cy="15" r="4.5" fill="#fbbf24"/>
    <circle cx="50" cy="15" r="4.5" fill="#34d399"/>

    <text
      x="180"
      y="19.5"
      text-anchor="middle"
      font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
      font-size="11"
      fill="#7c8aad"
    >
      api/views.py
    </text>

    <!-- Code -->
    <g
      font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
      font-size="13"
    >
      <text x="20" y="58" fill="#818cf8">class</text>
      <text x="62" y="58" fill="#e2e8f0">UserViewSet</text>
      <text x="160" y="58" fill="#7c8aad">(APIView):</text>

      <rect
        x="36"
        y="70"
        width="90"
        height="8"
        rx="4"
        fill="#38bdf8"
        opacity="0.85"
      />

      <rect
        x="36"
        y="86"
        width="150"
        height="8"
        rx="4"
        fill="#4b5a7d"
        opacity="0.85"
      />

      <rect
        x="36"
        y="102"
        width="110"
        height="8"
        rx="4"
        fill="#4b5a7d"
        opacity="0.6"
      />

      <text x="20" y="132" fill="#34d399">GET</text>
      <text x="58" y="132" fill="#e2e8f0">/api/v1/users/</text>

      <rect
        x="20"
        y="140"
        width="220"
        height="8"
        rx="4"
        fill="#a78bfa"
        opacity="0.75"
      />

      <text x="20" y="168" fill="#fbbf24">POST</text>
      <text x="66" y="168" fill="#e2e8f0">/api/v1/predict/</text>

      <rect
        x="20"
        y="176"
        width="180"
        height="8"
        rx="4"
        fill="#f472b6"
        opacity="0.75"
      />
    </g>

    <!-- Cursor -->
    <rect
      x="245"
      y="162"
      width="8"
      height="14"
      fill="#38bdf8"
      opacity="0.9"
    />
  </g>

  <!-- Backend -> AI -->
  <path
    d="M 420 158 C 480 158, 480 158, 540 158"
    stroke="url(#accentBlue)"
    stroke-width="2"
    fill="none"
    opacity="0.55"
    stroke-dasharray="2 6"
    stroke-linecap="round"
  />

  <!-- ============================================================
       CENTER: Neural Network / AI
       ============================================================ -->
  <g transform="translate(540,40)">

    <!-- Connections -->
    <g
      stroke="url(#accentPurple)"
      stroke-width="1.4"
      opacity="0.45"
    >
      <line x1="20" y1="60" x2="110" y2="30"/>
      <line x1="20" y1="60" x2="110" y2="90"/>
      <line x1="20" y1="60" x2="110" y2="150"/>

      <line x1="20" y1="120" x2="110" y2="30"/>
      <line x1="20" y1="120" x2="110" y2="90"/>
      <line x1="20" y1="120" x2="110" y2="150"/>

      <line x1="20" y1="180" x2="110" y2="90"/>
      <line x1="20" y1="180" x2="110" y2="150"/>

      <line x1="110" y1="30" x2="200" y2="70"/>
      <line x1="110" y1="90" x2="200" y2="70"/>
      <line x1="110" y1="90" x2="200" y2="140"/>
      <line x1="110" y1="150" x2="200" y2="140"/>
      <line x1="110" y1="150" x2="200" y2="70"/>
    </g>

    <!-- Input -->
    <g fill="#38bdf8">
