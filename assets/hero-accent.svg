      SQL / DATA
    </text>
  </g>

  <!-- ============================================================
       BOTTOM: Identity
       ============================================================ -->
  <g id="copy" transform="translate(60,0)">

    <text
      x="0"
      y="290"
      font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
      font-size="22"
      font-weight="600"
      fill="#f1f5f9"
