        fill="none"
        stroke="url(#accentBlue)"
        stroke-width="1.5"
        opacity="0.8"
      />

      <path
        d="M0,73.3 C0,84.35 26.86,93.3 60,93.3 C93.14,93.3 120,84.35 120,73.3"
        fill="none"
        stroke="#2a3550"
        stroke-width="1.5"
      />

      <path
        d="M0,126.6 C0,137.65 26.86,146.6 60,146.6 C93.14,146.6 120,137.65 120,126.6"
        fill="none"
        stroke="#2a3550"
        stroke-width="1.5"
      />

      <ellipse
        cx="60"
        cy="20"
        rx="60"
        ry="10"
        fill="#151f36"
        stroke="url(#accentBlue)"
        stroke-width="1.5"
      />
    </g>

    <text
      x="60"
      y="200"
      text-anchor="middle"
      font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
      font-size="12"
      fill="#8b95b8"
      letter-spacing="1.5"
