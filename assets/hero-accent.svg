      <circle cx="20" cy="120" r="6"/>
      <circle cx="20" cy="180" r="6"/>
    </g>

    <!-- Hidden -->
    <g fill="#a78bfa">
      <circle cx="110" cy="30" r="6"/>
      <circle cx="110" cy="90" r="6"/>
      <circle cx="110" cy="150" r="6"/>
    </g>

    <!-- Output -->
    <g fill="#f472b6" filter="url(#softGlow)">
      <circle cx="200" cy="70" r="7"/>
      <circle cx="200" cy="140" r="7"/>
    </g>

    <text
      x="110"
      y="222"
      text-anchor="middle"
      font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
      font-size="12"
      fill="#8b95b8"
      letter-spacing="1.5"
    >
      MACHINE LEARNING
    </text>
  </g>

  <!-- AI -> Database -->
  <path
    d="M 800 158 C 850 158, 850 158, 900 158"
    stroke="url(#accentPurple)"
    stroke-width="2"
    fill="none"
    opacity="0.55"
    stroke-dasharray="2 6"
    stroke-linecap="round"
  />

