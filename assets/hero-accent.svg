      Abolfazl Vaezi
    </text>

    <text
      x="220"
      y="290"
      font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
      font-size="14"
      fill="#8b95b8"
    >
      Web Developer · AI Developer — Python / Django / DRF / APIs / SQL / ML
    </text>

  </g>
</svg>